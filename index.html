<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポートフォリオ</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root {
  --bg:         #0d0d0d;
  --bg2:        #141414;
  --bg3:        #1a1a1a;
  --surface:    #1e1e1e;
  --surface2:   #252525;
  --border:     #2e2e2e;
  --accent:     #f5d000;
  --accent-dim: rgba(245,208,0,0.12);
  --accent-glow:rgba(245,208,0,0.25);
  --text:       #f0f0f0;
  --text2:      #999;
  --text3:      #555;
  --radius-sm:  8px;
  --radius:     14px;
  --radius-lg:  20px;
}

/* ============================================================
   RESET & BASE
============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
table { border-collapse: collapse; width: 100%; }
td, th { padding: 8px 12px; border: 1px solid var(--border); font-size: 0.9rem; }
th { background: var(--surface2); color: var(--accent); }

/* ============================================================
   LOADING OVERLAY
============================================================ */
#loadingOverlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  z-index: 9999;
  transition: opacity 0.5s;
}
#loadingOverlay.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 48px; height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.loading-text { color: var(--text2); font-size: 0.9rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   HEADER
============================================================ */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.header-logo {
  flex-shrink: 0;
  display: flex;
  align-items: center;
}
.header-logo img {
  height: 40px;
  width: auto;
  object-fit: contain;
  display: block;
}

.site-name {
  font-family: 'M PLUS 1 Code', monospace;
  font-weight: 900;
  font-size: 1.1rem;
  color: var(--accent);
  white-space: nowrap;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}

/* ============================================================
   TAB NAV (in header)
============================================================ */
.nav-tabs {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1;
  justify-content: center;
}
.nav-tabs::-webkit-scrollbar { display: none; }

.nav-tab {
  padding: 6px 16px;
  border-radius: 50px;
  background: transparent;
  border: 1.5px solid var(--border);
  color: var(--text2);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s;
}
.nav-tab:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.nav-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
  font-weight: 700;
  box-shadow: 0 0 16px var(--accent-glow);
}

/* ============================================================
   PAGE SECTIONS
============================================================ */
.page { display: none; }
.page.active { display: block; }

/* ============================================================
   HERO STRIP (ページ上部の見出しライン)
============================================================ */
.page-hero {
  padding: 40px 24px 0;
  max-width: 1200px;
  margin: 0 auto;
}
.page-hero-title {
  font-family: 'M PLUS 1 Code', monospace;
  font-size: clamp(1.8rem, 5vw, 3rem);
  font-weight: 900;
  color: var(--accent);
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.page-hero-sub {
  color: var(--text2);
  font-size: 0.88rem;
  margin-top: 6px;
}

/* ============================================================
   SECTION HEADING
============================================================ */
.section-wrap {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px 0;
}
.section-heading {
  font-family: 'M PLUS 1 Code', monospace;
  font-size: 1rem;
  color: var(--accent);
  letter-spacing: 0.06em;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.section-heading::before {
  content: '';
  display: block;
  width: 4px;
  height: 1.1em;
  background: var(--accent);
  border-radius: 2px;
  flex-shrink: 0;
}
.section-heading::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ============================================================
   CARDS GRID
============================================================ */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
}

/* wide card — full width */
.card-wide {
  grid-column: 1 / -1;
}

/* ============================================================
   BASE CARD STYLE
============================================================ */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.35s ease both;
}
.card:hover {
  transform: translateY(-3px);
  border-color: rgba(245,208,0,0.4);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(245,208,0,0.1);
}
.card-link { cursor: pointer; display: block; }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* ============================================================
   TYPE: html
============================================================ */
.card-html {
  padding: 20px 24px;
  color: var(--text);
  font-size: 0.9rem;
  line-height: 1.7;
}
.card-html img {
  max-width: 100%;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
}
.card-html table { margin-top: 12px; }
.card-html td { color: var(--text); }
.card-html tr:first-child td:first-child { color: var(--text2); }

/* ============================================================
   TYPE: link/youtube  &  img_comment
============================================================ */
.card-media {
  display: flex;
  flex-direction: row;
  align-items: stretch;
  min-height: 80px;
}
.card-thumb-wrap {
  flex: 0 0 128px;
  padding: 10px 0 10px 10px;
  display: flex;
  align-items: center;
}
.card-thumb {
  width: 128px;
  aspect-ratio: 16/9;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface2);
}
.card-body {
  flex: 1;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
  gap: 4px;
}
.card-label {
  font-size: 0.68rem;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.card-title {
  font-size: 0.93rem;
  font-weight: 700;
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-all;
  color: var(--text);
}
.card-txt {
  font-size: 0.9rem;
  color: var(--text);
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
/* fa_x専用: 全文表示・省略なし */
.card-txt-fax {
  display: block;
  -webkit-line-clamp: unset;
  overflow: visible;
}

/* ============================================================
   TYPE: link/x
============================================================ */
.card-x-img {
  width: 120px;
  height: 120px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface2);
}
.card-sq-wrap {
  flex: 0 0 90px;
  padding: 10px 0 10px 10px;
  display: flex;
  align-items: center;
}
.card-sq {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--surface2);
}
.card-x-wrap {
  flex: 0 0 120px;
  padding: 10px 0 10px 10px;
  display: flex;
  align-items: center;
}

/* ============================================================
   TYPE: fa_x  (虫眼鏡ボタン付き)
============================================================ */
.card-fax-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.btn-zoom {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 50px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 0.75rem;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.btn-zoom:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ============================================================
   LIGHTBOX
============================================================ */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 9000;
  align-items: center;
  justify-content: center;
  padding: 24px;
  cursor: zoom-out;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
  border-radius: var(--radius-sm);
  box-shadow: 0 20px 80px rgba(0,0,0,0.8);
}

/* ============================================================
   FOOTER
============================================================ */
footer {
  margin-top: 60px;
  border-top: 1px solid var(--border);
  padding: 32px 24px;
  text-align: center;
  color: var(--text3);
  font-size: 0.8rem;
}
footer .footer-site {
  font-family: 'M PLUS 1 Code', monospace;
  font-size: 1.1rem;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 8px;
}

/* ============================================================
   PAGE BOTTOM PADDING
============================================================ */
.page-bottom { height: 60px; }

/* ============================================================
   RESPONSIVE
============================================================ */
@media (max-width: 640px) {
  header { padding: 0 12px; gap: 10px; }
  .site-name { font-size: 0.95rem; }
  .nav-tab { padding: 5px 12px; font-size: 0.78rem; }
  .section-wrap { padding: 24px 12px 0; }
  .page-hero { padding: 24px 12px 0; }
  .cards-grid { grid-template-columns: 1fr; gap: 10px; }
  .card-thumb-wrap { flex: 0 0 96px; }
  .card-thumb { width: 96px; }
  .card-x-wrap { flex: 0 0 96px; }
  .card-x-img { width: 96px; height: 96px; }
}
</style>
</head>
<body>

<!-- ローディング -->
<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">読み込み中...</div>
</div>

<!-- ヘッダー (タブはJSで生成) -->
<header>
  <div class="site-name" id="siteName">Portfolio</div>
  <div class="nav-tabs" id="navTabs"></div>
  <div class="header-logo" id="headerLogo" style="display:none">
    <img id="headerLogoImg" src="" alt="logo">
  </div>
</header>

<!-- ページコンテナ (JSで生成) -->
<div id="pagesContainer"></div>

<!-- フッター (database末尾の[FOOTER]で上書き可) -->
<footer>
  <div class="footer-site" id="footerSite">Portfolio</div>
  <div id="footerText"></div>
</footer>

<!-- ライトボックス -->
<div id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<!-- ============================================================
     DATABASE PARSER & RENDERER
     ============================================================ -->
<script>
'use strict';

/* ----------------------------------------------------------
   UTILITIES
---------------------------------------------------------- */
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function ytThumb(url) {
  const m = url.match(/[?&]v=([^&\s]+)/);
  return m ? `https://img.youtube.com/vi/${m[1]}/mqdefault.jpg` : '';
}

/* ----------------------------------------------------------
   共通タブ切り替え
   pageId: 表示するページのid属性値（例: 'page-0', 'page-5'）
---------------------------------------------------------- */
function switchTab(pageId) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const targetTab  = document.querySelector(`.nav-tab[data-page="${pageId}"]`);
  const targetPage = document.getElementById(pageId);
  if (targetTab)  targetTab.classList.add('active');
  if (targetPage) targetPage.classList.add('active');
}

/*
==============================================================
  DATABASE / DATABASE_YT 仕様まとめ
==============================================================

【database ファイル】

  ■ メタ指定（ファイル先頭付近に記載）
    [SITE_NAME]テキスト      サイト名（タブタイトル・ヘッダー）
    [LOGO]パス or URL        ヘッダー左上ロゴ画像（省略でテキスト表示）
    [FOOTER]テキスト         フッタークレジット

  ■ ページ・セクション
    # タイトル               タブ追加（ページ）
    #[NoPageTitle] タイトル  タブは表示するがページ内タイトルは非表示
    ## 見出し                ページ内セクション見出し

  ■ 共通フィールド（1a: 載せる情報の取捨選択と指定）
    [TAG]テキスト            カード左上のラベル（省略でデフォルト値）
    [TITLE]テキスト          太字タイトル
    [TXT]テキスト            本文テキスト
    [IMG]パス or URL         画像
    [URL]URL                 リンク先

  ■ カード種別（1b: サイズとレイアウトの指定）
    [START, サイズ, 種別]
    [START, サイズ, 種別, サブ種別]

    サイズ:
      wide  ページ横幅いっぱい
      card  グリッド内の1カード（約1/3幅）

    種別:
      html            生HTMLをそのまま表示（フィールドでなくブロック内に記述）
      thumb           横長サムネ（16:9）＋タイトル＋本文
      thumb,youtube   thumbの派生。[URL]からYouTubeサムネ・タイトルを自動取得
      square          正方形サムネ＋タイトル＋本文
      square,x        squareの派生。[IMG]省略時にXポストの画像・タイトルを自動取得
      fa              正方形サムネ＋本文（全文）＋虫眼鏡ボタン
      fa,x            faの派生。[IMG]省略時にXポストの画像を自動取得

    後方互換（旧→新に内部変換済みのため引き続き使用可）:
      link,youtube → thumb,youtube
      link,x       → square,x
      link,general → square
      img_comment  → thumb
      fa_x         → fa,x

  ■ コメント
    !!! 以降の文字列はコメントとして無視（htmlブロック内を除く）

--------------------------------------------------------------

【database_yt ファイル】

  ■ カテゴリ指定
    # 動画 / # ショート / # 配信

  ■ エントリ（1行1動画）
    n  URL   通常（黒カード）
    r  URL   投稿者以外が関わる（青カード）
    c  URL   コラボ（暗めピンクカード）
    nr URL   nかつr（黒青グラデーション）
    nc URL   nかつc（黒ピンクグラデーション）

  ■ 対応URLフォーマット
    https://youtu.be/XXXXX
    https://www.youtube.com/watch?v=XXXXX
    https://youtube.com/shorts/XXXXX
    https://www.youtube.com/live/XXXXX

  ■ コメント
    !!! 以降の文字列はコメントとして無視

==============================================================
*/

/** X投稿URLから埋め込みデータを取得 (noembed) */
const xCache = {};
async function fetchX(url) {
  if (xCache[url]) return xCache[url];
  try {
    const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
    const d = await r.json();
    xCache[url] = d;
    return d;
  } catch { return {}; }
}

/** YouTubeタイトルを取得 (noembed)
 *  shorts / live / youtu.be 等は watch?v= 形式に正規化してから問い合わせる */
const ytCache = {};
async function fetchYT(url) {
  if (ytCache[url]) return ytCache[url];
  try {
    const vid       = extractVideoId(url);
    const normalUrl = vid ? `https://www.youtube.com/watch?v=${vid}` : url;
    /* 正規化済みキャッシュが既にあれば元URLにも紐付けて返す */
    if (ytCache[normalUrl]) { ytCache[url] = ytCache[normalUrl]; return ytCache[url]; }
    const r = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(normalUrl)}`);
    const d = await r.json();
    ytCache[url]       = d;
    ytCache[normalUrl] = d;
    return d;
  } catch { return {}; }
}

/* ----------------------------------------------------------
   DATABASE PARSER
---------------------------------------------------------- */

/**
 * databaseテキストをパースして構造体を返す
 * returns: { siteName, footerText, pages: [{ title, sections: [{ heading, cards }] }] }
 * card: { size, type, subtype, fields: { URL, TXT, IMG, TITLE, html } }
 */
function parseDatabase(text) {
  const lines = text.split('\n');
  const result = { siteName: 'Portfolio', logoImg: '', footerText: '', pages: [] };

  let currentPage    = null;
  let currentSection = null;
  let currentCard    = null;
  let htmlLines      = [];
  let inCard         = false;

  function finalizeCard() {
    if (!currentCard || !currentSection) return;
    if (currentCard.type === 'html') {
      currentCard.fields.html = htmlLines.join('\n').trim();
    }
    currentSection.cards.push(currentCard);
    currentCard = null;
    htmlLines   = [];
    inCard      = false;
  }

  for (const rawLine of lines) {
    /* 「!!!」以降をコメントとして除去（htmlタイプ内は除く） */
    const stripped = inCard && currentCard?.type === 'html'
      ? rawLine
      : rawLine.replace(/!!!.*$/, '');
    const line = stripped.trim();
    if (!line) continue;

    /* メタ指定 */
    if (line.startsWith('[SITE_NAME]')) {
      result.siteName = line.replace('[SITE_NAME]','').trim();
      continue;
    }
    if (line.startsWith('[LOGO]')) {
      result.logoImg = line.replace('[LOGO]','').trim();
      continue;
    }
    if (line.startsWith('[FOOTER]')) {
      result.footerText = line.replace('[FOOTER]','').trim();
      continue;
    }

    /* ページ切り替え: # タイトル */
    if (/^#\s+/.test(line) && !line.startsWith('##')) {
      finalizeCard();
      const rawTitle    = line.replace(/^#\s+/,'');
      const noPageTitle = rawTitle.includes('[NoPageTitle]');
      const title       = rawTitle.replace('[NoPageTitle]','').trim();
      currentPage = { title, noPageTitle, sections: [] };
      result.pages.push(currentPage);
      currentSection = null;
      continue;
    }

    /* セクション見出し: ## タイトル */
    if (line.startsWith('## ')) {
      finalizeCard();
      if (!currentPage) { currentPage = { title: 'Main', sections: [] }; result.pages.push(currentPage); }
      currentSection = { heading: line.replace(/^##\s+/,''), cards: [] };
      currentPage.sections.push(currentSection);
      continue;
    }

    /* カード開始: [START,...] */
    if (line.startsWith('[START')) {
      finalizeCard();
      if (!currentSection) {
        if (!currentPage) { currentPage = { title: 'Main', sections: [] }; result.pages.push(currentPage); }
        currentSection = { heading: '', cards: [] };
        currentPage.sections.push(currentSection);
      }
      // [START,SIZE,TYPE] or [START,SIZE,TYPE,SUBTYPE]
      const inner = line.replace(/^\[START,?/,'').replace(/\]$/,'');
      const parts = inner.split(',').map(s => s.trim());
      currentCard = {
        size:    parts[0] || 'card',
        type:    parts[1] || 'html',
        subtype: parts[2] || '',
        fields:  {},
      };
      inCard    = true;
      htmlLines = [];
      continue;
    }

    /* カード終了: [END] */
    if (line === '[END]') {
      finalizeCard();
      continue;
    }

    /* カード内フィールド */
    if (inCard && currentCard) {
      if (line.startsWith('[URL]')) {
        currentCard.fields.URL = line.replace('[URL]','').trim();
      } else if (line.startsWith('[TXT]')) {
        currentCard.fields.TXT = line.replace('[TXT]','').trim();
      } else if (line.startsWith('[IMG]')) {
        currentCard.fields.IMG = line.replace('[IMG]','').trim();
      } else if (line.startsWith('[TITLE]')) {
        currentCard.fields.TITLE = line.replace('[TITLE]','').trim();
      } else if (line.startsWith('[TAG]')) {
        currentCard.fields.TAG = line.replace('[TAG]','').trim();
      } else if (line.startsWith('[VIDEO_TYPE]')) {
        currentCard.fields.VIDEO_TYPE = line.replace('[VIDEO_TYPE]','').trim(); // video / short / live
      } else if (currentCard.type === 'html') {
        htmlLines.push(rawLine); // html タイプはそのまま蓄積
      }
    }
  }

  finalizeCard();
  return result;
}

/* ----------------------------------------------------------
   CARD BUILDERS
   カード種別（1b）: html / thumb / square / fa
   共通フィールド（1a）: TAG TITLE TXT IMG URL
---------------------------------------------------------- */

function buildCard(card, idx) {
  const wrapper = document.createElement('div');
  const delay   = Math.min(idx * 0.04, 0.8);
  wrapper.style.animationDelay = `${delay}s`;

  const isWide = card.size === 'wide';
  if (isWide) wrapper.classList.add('card-wide');

  const { type, subtype, fields } = card;

  /* --------------------------------------------------
     後方互換マッピング
     旧カード種別 → 新カード種別に内部変換
  -------------------------------------------------- */
  let resolvedType    = type;
  let resolvedSubtype = subtype;

  // 旧: link,youtube / link,x / link,general / img_comment / fa_x
  if (type === 'link' && subtype === 'youtube')  { resolvedType = 'thumb';  resolvedSubtype = 'youtube'; }
  if (type === 'link' && subtype === 'x')        { resolvedType = 'square'; resolvedSubtype = 'x'; }
  if (type === 'link' && subtype === 'general')  { resolvedType = 'square'; resolvedSubtype = ''; }
  if (type === 'img_comment')                    { resolvedType = 'thumb';  resolvedSubtype = ''; }
  if (type === 'fa_x')                           { resolvedType = 'fa';     resolvedSubtype = 'x'; }

  /* ---- html ---- */
  if (resolvedType === 'html') {
    wrapper.className += ' card';
    const inner = document.createElement('div');
    inner.className = 'card-html';
    inner.innerHTML = fields.html || '';
    wrapper.appendChild(inner);
    return wrapper;
  }

  /* ---- thumb: 横長サムネ（16:9）＋テキスト ---- */
  if (resolvedType === 'thumb') {
    const url   = fields.URL   || '#';
    const title = fields.TITLE || '';
    const txt   = fields.TXT   || '';
    const img   = fields.IMG   || (resolvedSubtype === 'youtube' ? ytThumb(url) : '');
    const label = fields.TAG   || (resolvedSubtype === 'youtube' ? 'YouTube' : 'Link');

    wrapper.className += ' card card-link';
    wrapper.innerHTML = `
      <div class="card-media">
        <div class="card-thumb-wrap">
          <img class="card-thumb thumb-img-${idx}" src="${esc(img)}" alt="${esc(title)}" loading="lazy">
        </div>
        <div class="card-body">
          <div class="card-label">${esc(label)}</div>
          <div class="card-title thumb-title-${idx}">${esc(title) || (resolvedSubtype === 'youtube' ? '読み込み中...' : '')}</div>
          ${txt ? `<div class="card-txt">${esc(txt)}</div>` : ''}
        </div>
      </div>`;

    /* YouTubeはタイトルを非同期取得 */
    if (resolvedSubtype === 'youtube') {
      (async () => {
        const d  = await fetchYT(url);
        const el = wrapper.querySelector(`.thumb-title-${idx}`);
        if (el && !fields.TITLE) el.textContent = d.title || url;
      })();
    }

    if (url !== '#') wrapper.addEventListener('click', () => window.open(url, '_blank', 'noopener'));
    return wrapper;
  }

  /* ---- square: 正方形サムネ＋テキスト ---- */
  if (resolvedType === 'square') {
    const url   = fields.URL   || '#';
    const title = fields.TITLE || '';
    const txt   = fields.TXT   || '';
    const label = fields.TAG   || (resolvedSubtype === 'x' ? '𝕏 Post' : 'Link');

    wrapper.className += ' card card-link';
    wrapper.innerHTML = `
      <div class="card-media">
        <div class="card-x-wrap">
          <img class="card-x-img sq-img-${idx}" src="${esc(fields.IMG || '')}" alt="${esc(title)}" loading="lazy"${fields.IMG ? '' : ' style="display:none"'}>
        </div>
        <div class="card-body">
          <div class="card-label">${esc(label)}</div>
          ${title ? `<div class="card-title sq-title-${idx}">${esc(title)}</div>`
                  : `<div class="card-title sq-title-${idx}">${resolvedSubtype === 'x' ? '読み込み中...' : ''}</div>`}
          ${txt ? `<div class="card-txt">${esc(txt)}</div>` : ''}
        </div>
      </div>`;

    /* X投稿はタイトル・サムネを非同期取得（[IMG]未指定時のみ） */
    if (resolvedSubtype === 'x') {
      (async () => {
        const d     = await fetchX(url);
        const imgEl = wrapper.querySelector(`.sq-img-${idx}`);
        const txtEl = wrapper.querySelector(`.sq-title-${idx}`);
        if (txtEl && !fields.TITLE) txtEl.textContent = d.title || url;
        const imgSrc = fields.IMG || d.thumbnail_url || '';
        if (imgEl && imgSrc) { imgEl.src = imgSrc; imgEl.style.display = 'block'; }
      })();
    }

    if (url !== '#') wrapper.addEventListener('click', () => window.open(url, '_blank', 'noopener'));
    return wrapper;
  }

  /* ---- fa: 正方形サムネ＋全文TXT＋虫眼鏡ボタン ---- */
  if (resolvedType === 'fa') {
    const url   = fields.URL || '';
    const txt   = fields.TXT || '';
    const label = fields.TAG || 'Fan Art';

    wrapper.className += ' card card-link';
    wrapper.innerHTML = `
      <div class="card-media">
        <div class="card-x-wrap">
          <img class="card-x-img fa-img-${idx}" src="" alt="" loading="lazy" style="display:none">
        </div>
        <div class="card-body">
          <div class="card-label">${esc(label)}</div>
          <div class="card-txt card-txt-fax">${esc(txt)}</div>
          <div class="card-fax-actions">
            <button class="btn-zoom" data-idx="${idx}">🔍 画像を拡大</button>
          </div>
        </div>
      </div>`;

    /* [IMG]があれば即表示、なければX（subtype=x）から取得 */
    const imgEl = wrapper.querySelector(`.fa-img-${idx}`);
    if (fields.IMG) {
      imgEl.src           = fields.IMG;
      imgEl.style.display = 'block';
      imgEl.dataset.full  = fields.IMG;
    } else if (resolvedSubtype === 'x') {
      (async () => {
        const d = await fetchX(url);
        if (imgEl && d.thumbnail_url) {
          imgEl.src           = d.thumbnail_url;
          imgEl.style.display = 'block';
          imgEl.dataset.full  = d.thumbnail_url;
        }
      })();
    }

    wrapper.addEventListener('click', e => {
      if (e.target.closest('.btn-zoom')) return;
      window.open(url, '_blank', 'noopener');
    });
    wrapper.querySelector('.btn-zoom').addEventListener('click', e => {
      e.stopPropagation();
      openLightbox(imgEl ? (imgEl.dataset.full || imgEl.src) : '');
    });

    return wrapper;
  }

  /* フォールバック */
  wrapper.className += ' card';
  wrapper.innerHTML = `<div class="card-html"><pre>${esc(JSON.stringify(card, null, 2))}</pre></div>`;
  return wrapper;
}

/* ----------------------------------------------------------
   LIGHTBOX
---------------------------------------------------------- */
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});

/* ----------------------------------------------------------
   RENDER PAGES
---------------------------------------------------------- */
function renderPages(data) {
  /* サイト名 */
  const sn = data.siteName || 'Portfolio';
  document.title                                     = sn;
  document.getElementById('siteName').textContent   = sn;
  document.getElementById('footerSite').textContent = sn;

  /* ロゴ or サイト名（左上） */
  const siteNameEl = document.getElementById('siteName');
  if (data.logoImg) {
    siteNameEl.innerHTML = `<img src="${data.logoImg}" alt="${esc(sn)}" style="height:36px;width:auto;object-fit:contain;display:block;">`;
    document.getElementById('headerLogo').style.display = 'none';
  } else {
    document.getElementById('headerLogo').style.display = 'none';
  }
  /* クリックで最初のタブ（page-0）へ */
  siteNameEl.style.cursor = 'pointer';
  siteNameEl.addEventListener('click', () => switchTab('page-0'));
  if (data.footerText) {
    document.getElementById('footerText').textContent = data.footerText;
  }

  const navTabs  = document.getElementById('navTabs');
  const container = document.getElementById('pagesContainer');
  navTabs.innerHTML  = '';
  container.innerHTML = '';

  if (data.pages.length === 0) return;

  data.pages.forEach((page, pi) => {
    /* タブ */
    const tab = document.createElement('button');
    tab.className   = 'nav-tab' + (pi === 0 ? ' active' : '');
    tab.textContent = page.title;
    tab.dataset.page = pi;
    tab.addEventListener('click', () => switchTab(`page-${pi}`));
    navTabs.appendChild(tab);

    /* ページ要素 */
    const pageEl = document.createElement('div');
    pageEl.className = 'page' + (pi === 0 ? ' active' : '');
    pageEl.id        = `page-${pi}`;

    /* ページヒーロー */
    const hero = document.createElement('div');
    hero.className = 'page-hero';
    if (!page.noPageTitle) {
      hero.innerHTML = `<div class="page-hero-title">${esc(page.title)}</div>`;
    }
    pageEl.appendChild(hero);

    let cardIdx = 0;

    page.sections.forEach(section => {
      const sw = document.createElement('div');
      sw.className = 'section-wrap';

      if (section.heading) {
        const sh = document.createElement('div');
        sh.className   = 'section-heading';
        sh.textContent = section.heading;
        sw.appendChild(sh);
      }

      const grid = document.createElement('div');
      grid.className = 'cards-grid';

      section.cards.forEach(card => {
        grid.appendChild(buildCard(card, cardIdx++));
      });

      sw.appendChild(grid);
      pageEl.appendChild(sw);
    });

    const pb = document.createElement('div');
    pb.className = 'page-bottom';
    pageEl.appendChild(pb);

    container.appendChild(pageEl);
  });
}

/* ----------------------------------------------------------
   INIT
---------------------------------------------------------- */
(async () => {
  const overlay = document.getElementById('loadingOverlay');
  let data;

  try {
    const res = await fetch('./database');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    data = parseDatabase(text);
    renderPages(data);
  } catch (err) {
    console.error('database 読み込みエラー:', err);
    document.querySelector('.loading-text').textContent =
      'database ファイルの読み込みに失敗しました。\nindex.html と同じディレクトリに database ファイルを置いてください。\n（ローカルの file:// では動作しません。GitHub Pages 等のサーバーが必要です）';
    return;
  }

  /* プラグインをロード */
  await loadPlugins();

  overlay.classList.add('hidden');
  setTimeout(() => overlay.remove(), 600);
})();

/* ----------------------------------------------------------
   PLUGIN LOADER
   plugins/manifest.json を読み込み、各プラグインJSを動的にロードする
   プラグイン側は window.ArniePlugins.register({ id, tabLabel, init }) を呼ぶ
   init(container, ctx) の ctx には共有ユーティリティを渡す
---------------------------------------------------------- */
window.ArniePlugins = (() => {
  const queue = [];
  return {
    register(plugin) { queue.push(plugin); },
    flush()          { return queue.splice(0); },
  };
})();

async function loadPlugins() {
  /* manifest.json を取得 */
  let manifest = [];
  try {
    const r = await fetch('./plugins/manifest.json');
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    manifest = await r.json();
  } catch (e) {
    console.warn('[plugins] manifest.json 読み込みエラー:', e);
    return;
  }

  /* 共有コンテキスト（プラグインに渡すユーティリティ） */
  const ctx = { esc, fetchYT, ytCache, switchTab };

  /* 各プラグインJSをロードして init を実行 */
  for (const entry of manifest) {
    try {
      await loadScript(entry.src);
      const plugins = window.ArniePlugins.flush();
      for (const plugin of plugins) {
        const pageEl = createPluginPage(plugin.tabLabel);
        await plugin.init(pageEl, ctx);
      }
    } catch (e) {
      console.warn(`[plugins] ${entry.src} の読み込みエラー:`, e);
    }
  }
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function createPluginPage(tabLabel) {
  const navTabs   = document.getElementById('navTabs');
  const container = document.getElementById('pagesContainer');
  const idx       = container.querySelectorAll('.page').length;
  const pageId    = `page-${idx}`;

  /* タブボタン */
  const tab = document.createElement('button');
  tab.className    = 'nav-tab';
  tab.textContent  = tabLabel;
  tab.dataset.page = pageId;
  tab.addEventListener('click', () => switchTab(pageId));
  navTabs.appendChild(tab);

  /* ページ要素 */
  const pageEl     = document.createElement('div');
  pageEl.className = 'page';
  pageEl.id        = pageId;
  container.appendChild(pageEl);

  return pageEl;
}
