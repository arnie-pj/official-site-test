<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>閲覧確認</title>
<style>
  :root {
    --base-color: #FFFFCD;
    --accent-color: #404040;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: var(--base-color);
    color: #FFFFFF;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .container {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }

  .warning-icon {
    font-size: 48px;
    color: var(--accent-color);
    margin-bottom: 16px;
    line-height: 1;
  }

  h1 {
    font-size: 20px;
    color: var(--accent-color);
    letter-spacing: 0.05em;
    margin-bottom: 24px;
  }

  p {
    font-size: 14px;
    line-height: 1.8;
    color: #404040;
    margin-bottom: 32px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.btn {
    display: block;
    padding: 14px 24px;
    border-radius: 4px;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.05em;
    transition: opacity 0.2s ease;
  }

  a.btn:hover {
    opacity: 0.8;
  }

  .btn-enter {
    background-color: var(--accent-color);
    color: var(--base-color);
    border: 2px solid var(--accent-color);
  }

  .btn-back {
    background-color: transparent;
    color: #888888;
    border: 1px solid #444444;
  }

  .btn-back:hover {
    color: #CCCCCC;
    border-color: #666666;
  }

  footer {
    margin-top: 32px;
    font-size: 11px;
    color: #555555;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="warning-icon">⚠</div>
    <h1>閲覧に関する注意</h1>
    <p>
      このページの先には、性的な表現を含む作品(R-18)が含まれています。<br>
      18歳未満の方、また公共の場所での閲覧はご遠慮ください。
    </p>
    <div class="buttons">
      <a href="https://x.com/Seia_Hikage/status/2078573561334391073" class="btn btn-enter">閲覧する</a>
      <!-- <a href="javascript:void(0);" class="btn btn-back" onclick="history.back();">戻る</a> -->
    </div>
  </div>
</body>
</html>
